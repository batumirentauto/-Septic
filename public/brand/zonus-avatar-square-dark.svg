<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" fill="none">
  <!-- Square 1:1 Profile Avatar (White on Matte Black) -->
  <rect width="1024" height="1024" fill="#09090B"/>
  
  <!-- Safe circular crop guide indicator (invisible, ensures safe zone) -->
  <g transform="translate(512, 512)">
    <!-- Centered Typographic ZONUS with generous margins for circular avatars -->
    <text x="0" y="24" 
          text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" 
          font-size="124" 
          font-weight="900" 
          letter-spacing="24" 
          fill="#FFFFFF">ZONUS</text>
  </g>
</svg>
