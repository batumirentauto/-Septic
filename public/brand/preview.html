<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZONUS — Typographic Identity Showcase</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      color: #f4f4f5;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 900px; width: 100%; }
    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a1a1aa;
      border: 1px solid #27272a;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    p.sub { color: #a1a1aa; font-size: 14px; margin-bottom: 40px; }
    
    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 700;
      color: #71717a;
      margin: 32px 0 16px 0;
      font-family: 'JetBrains Mono', monospace;
    }

    .wordmark-card {
      border-radius: 12px;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border: 1px solid #27272a;
      transition: all 0.2s ease;
    }
    .wordmark-card:hover { transform: scale(1.01); border-color: #3f3f46; }
    .wordmark-card.dark { background: #09090b; }
    .wordmark-card.light { background: #ffffff; color: #000000; border-color: #e4e4e7; }
    .wordmark-card img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Typography & Wordmark</div>
    <h1>ZONUS • Minimalist Wordmark</h1>
    <p class="sub">Чистая эстетика шрифта без лишних эмблем и значков. Идеальные пропорции, широкая разрядка букв (tracking), строгий монохром.</p>

    <div class="section-title">Вариант 1: Только ZONUS (Чистый монохром)</div>
    <div class="wordmark-card dark">
      <img src="zonus-pure-dark.svg" alt="ZONUS Pure Dark">
    </div>
    <div class="wordmark-card light">
      <img src="zonus-pure-light.svg" alt="ZONUS Pure Light">
    </div>

    <div class="section-title">Вариант 2: ZONUS + STUDIO</div>
    <div class="wordmark-card dark">
      <img src="zonus-wordmark-dark.svg" alt="ZONUS Studio Dark">
    </div>
    <div class="wordmark-card light">
      <img src="zonus-wordmark-light.svg" alt="ZONUS Studio Light">
    </div>
  </div>
</body>
</html>
